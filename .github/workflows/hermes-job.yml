name: Hermes Job - Teste Cloud

on:
  workflow_dispatch:

jobs:
  hermes-job:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Redis Server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo redis-server --daemonize yes
          sleep 1
          redis-cli ping

      - name: Instalar dependências do Router/Gateway
        run: |
          python -m pip install --upgrade pip
          pip install -r hermes/llm_router/requirements-router.txt

      - name: Instalar Hermes
        run: |
          pip install -e ./hermes

      - name: Iniciar Router em background
        env:
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          OPENROUTER_KEY_1: ${{ secrets.OPENROUTER_KEY_1 }}
          OPENROUTER_KEY_2: ${{ secrets.OPENROUTER_KEY_2 }}
          OPENROUTER_KEY_3: ${{ secrets.OPENROUTER_KEY_3 }}
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
        run: |
          cd hermes/llm_router
          nohup uvicorn router:app --host 127.0.0.1 --port 8001 > router.log 2>&1 &
          sleep 3
          curl -s http://127.0.0.1:8001/health

      - name: Iniciar Gateway em background
        env:
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          OPENROUTER_KEY_1: ${{ secrets.OPENROUTER_KEY_1 }}
          OPENROUTER_KEY_2: ${{ secrets.OPENROUTER_KEY_2 }}
          OPENROUTER_KEY_3: ${{ secrets.OPENROUTER_KEY_3 }}
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
        run: |
          cd hermes/llm_router
          nohup uvicorn llm_gateway:app --host 127.0.0.1 --port 8000 > gateway.log 2>&1 &
          sleep 3
          curl -s http://127.0.0.1:8000/health

      - name: Executar Hermes em modo job
        env:
          OPENAI_BASE_URL: http://127.0.0.1:8000/v1
          OPENAI_API_KEY: local
        run: |
          hermes chat -q "Responda apenas: HERMES CLOUD OK"

      - name: Mostrar logs (sempre)
        if: always()
        run: |
          echo "=== ROUTER LOG ==="
          cat hermes/llm_router/router.log || true
          echo "=== GATEWAY LOG ==="
          cat hermes/llm_router/gateway.log || true
