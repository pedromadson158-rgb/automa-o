name: Teste de Conexões - MongoDB, Redis e Storj

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install pymongo boto3 upstash-redis

      - name: Testar MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python - <<'PY'
          import os
          from pymongo import MongoClient

          client = MongoClient(
              os.environ["MONGODB_URI"],
              serverSelectionTimeoutMS=10000
          )

          client.admin.command("ping")
          print("MongoDB OK")
          PY

      - name: Testar Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from upstash_redis import Redis

          redis = Redis(
              url=os.environ["UPSTASH_REDIS_REST_URL"],
              token=os.environ["UPSTASH_REDIS_REST_TOKEN"]
          )

          redis.ping()
          print("Redis OK")
          PY

      - name: Testar Storj
        env:
          STORJ_ACCESS_KEY: ${{ secrets.STORJ_ACCESS_KEY }}
          STORJ_SECRET_KEY: ${{ secrets.STORJ_SECRET_KEY }}
          STORJ_ENDPOINT: ${{ secrets.STORJ_ENDPOINT }}
          STORJ_BUCKET: ${{ secrets.STORJ_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.client import Config

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["STORJ_ENDPOINT"],
              aws_access_key_id=os.environ["STORJ_ACCESS_KEY"],
              aws_secret_access_key=os.environ["STORJ_SECRET_KEY"],
              config=Config(signature_version="s3v4")
          )

          bucket = os.environ["STORJ_BUCKET"]

          s3.head_bucket(Bucket=bucket)

          print("Storj OK")
          print("Bucket:", bucket)
          PY
