name: Worker Executor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r infra/requirements-infra.txt
          pip install -r hermes/llm_router/requirements-router.txt
          pip install playwright

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run worker
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: automacao
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          OPENROUTER_KEY_1: ${{ secrets.OPENROUTER_KEY_1 }}
          OPENROUTER_KEY_2: ${{ secrets.OPENROUTER_KEY_2 }}
          OPENROUTER_KEY_3: ${{ secrets.OPENROUTER_KEY_3 }}
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          WORKER_MAX_TASKS: 10
        run: |
          cd infra
          python worker.py
